[package]
name = "crypt_onchain"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Plays real Crypt sales on the Tari Ootle esmeralda testnet and records the transaction ids."
publish = false

# Its own workspace: ootle-rs pulls a large dependency tree the template and client do not need.
[workspace]

[dependencies]
ootle-rs = "0.31"
tari_ootle_transaction = "0.49"
tari_crypto = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The L1 burn proof file and its conversion to an Ootle claim, as the wallet daemon does it
# (tari-ootle v0.49.2, applications/tari_ootle_app_utilities/src/burn_claim_proof.rs).
tari_sidechain = "=9.0.0"
tari_transaction_components = "=6.3.0-pre.2"
tari_engine_types = "=0.49.2"
tari_template_lib_types = "0.36"
ootle_byte_type = { version = "0.18", features = ["crypto"] }
borsh = { version = "1.6", features = ["std"] }
bounded-vec = "0.9.0"
rand_core = { version = "0.6", features = ["getrandom"] }
# Sales: the same client code as the CLI, and the payout digest as the template computes it.
crypt_core = { path = "../core" }
tari_bor = "0.16"
sha2 = "0.10"
tari_ootle_common_types = "0.49"
